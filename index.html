<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Illustrations</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{touch-action:pan-y;display:flex;align-items:center;justify-content:center}
  #viewer{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  img{max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
</style>
</head>
<body>
<div id="viewer"><img id="photo" alt=""></div>
<script>
/*
  AJOUTE TES IMAGES DANS LE DOSSIER "images" DU SITE,
  puis modifie simplement la liste ci-dessous.
  Exemple : "images/poster01.jpg"
*/
const images = [
  "images/poster01.jpg",
  "images/poster02.jpg",
  "images/poster03.jpg"
];

let index = 0;
const photo = document.getElementById("photo");
const viewer = document.getElementById("viewer");

function show(n){
  index = (n + images.length) % images.length;
  photo.src = images[index];
}
show(0);

let startX = 0, startY = 0;
viewer.addEventListener("touchstart", e => {
  startX = e.changedTouches[0].clientX;
  startY = e.changedTouches[0].clientY;
}, {passive:true});

viewer.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    show(index + (dx < 0 ? 1 : -1));
  }
}, {passive:true});

// Flèches clavier pour tester sur ordinateur
document.addEventListener("keydown", e => {
  if(e.key === "ArrowRight") show(index+1);
  if(e.key === "ArrowLeft") show(index-1);
});
</script>
</body>
</html>
